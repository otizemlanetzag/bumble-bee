[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "bumble-bee"
version = "0.6.0"
description = "Python bindings for the Bumble Bee Servo-based web engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MPL-2.0" }

[tool.maturin]
manifest-path = "Cargo.toml"
bindings = "pyo3"
module-name = "bumble_bee"
